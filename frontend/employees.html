<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Taiga - Сотрудники</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header class="header">
            <h1>
                <img src="assets/images/logo_taiga.png" alt="Taiga" style="height: 40px; vertical-align: middle;">
                <span style="position: absolute; left: 50%; transform: translateX(-50%);">Управление компанией</span>
                <div style="display: flex; gap: 15px; align-items: center;">
                    <a href="rules.html" title="Правила обучения распознавания расходов" style="font-size: 24px; text-decoration: none; color: var(--secondary-color); transition: all 0.2s;" onmouseover="this.style.transform='scale(1.2)'; this.style.color='#2980b9';" onmouseout="this.style.transform='scale(1)'; this.style.color='var(--secondary-color)';">
                        📚
                    </a>
                    <a href="rules.html" title="Правила записи расходов" style="font-size: 24px; text-decoration: none; color: var(--secondary-color); transition: all 0.2s;" onmouseover="this.style.transform='scale(1.2)'; this.style.color='#2980b9';" onmouseout="this.style.transform='scale(1)'; this.style.color='var(--secondary-color)';">
                        📋
                    </a>
                </div>
            </h1>
            <nav class="nav">
                <div class="nav-left">
                    <a href="expenses.html" class="nav-link" id="expenses-nav-link">Расходы</a>
                    <a href="income.html" class="nav-link">Доходы</a>
                    <a href="taiga.html" class="nav-link">Объекты</a>
                    <a href="cash.html" class="nav-link" id="cash-nav-link">Касса</a>
                </div>
                <div class="nav-right">
                    <a href="shops.html" class="nav-link directory-link">Маги</a>
                    <a href="employees.html" class="nav-link directory-link active">Сотрудники</a>
                </div>
            </nav>
        </header>

        <!-- Main Content -->
        <main class="main">
            <div class="actions">
                <h2>Справочник сотрудников</h2>
                <div style="display: flex; gap: 10px; align-items: center;">
                    <label style="display: flex; align-items: center; gap: 5px; cursor: pointer;">
                        <input type="checkbox" id="show-dismissed" onchange="toggleDismissedEmployees()" checked>
                        <span>Показывать уволенных</span>
                    </label>
                    <button class="btn btn-primary" onclick="openAddEmployeeModal()">+ Добавить сотрудника</button>
                </div>
            </div>

            <!-- Employees Table -->
            <div class="table-container">
                <table class="table" id="employees-table">
                    <thead>
                        <tr>
                            <th style="width: 50px;">#</th>
                            <th>ФИО</th>
                            <th>Алиас</th>
                            <th>Должность</th>
                            <th>Телефон</th>
                            <th>Тип занятости</th>
                            <th>Статус</th>
                            <th style="width: auto; white-space: nowrap;">Дата трудоустройства</th>
                            <th style="width: auto; white-space: nowrap;">Дата увольнения</th>
                            <th style="width: 120px;">Действия</th>
                        </tr>
                    </thead>
                    <tbody id="employees-tbody">
                        <tr><td colspan="9" class="loading">Загрузка...</td></tr>
                    </tbody>
                </table>
            </div>
        </main>
    </div>

    <!-- Modal: Add/Edit Employee -->
    <div id="add-employee-modal" class="modal">
        <div class="modal-content employee-modal">
            <div class="modal-header">
                <h2 id="employee-modal-title">Добавить сотрудника</h2>
                <button class="modal-close" onclick="closeAddEmployeeModal()" type="button">&times;</button>
            </div>
            <div class="modal-body">
                <form id="add-employee-form">
                <input type="hidden" id="employee-id" name="id">
                <div class="form-group">
                    <label for="employee-last-name">Фамилия</label>
                    <input type="text" id="employee-last-name" name="last_name">
                </div>
                <div class="form-group">
                    <label for="employee-first-name">Имя *</label>
                    <input type="text" id="employee-first-name" name="first_name" required>
                </div>
                <div class="form-group">
                    <label for="employee-middle-name">Отчество</label>
                    <input type="text" id="employee-middle-name" name="middle_name">
                </div>
                <div class="form-group">
                    <label for="employee-alias">Алиас (сокращённое имя)</label>
                    <input type="text" id="employee-alias" name="alias" placeholder="например: Макс, Жура, Даня">
                </div>
                <div class="form-group">
                    <label for="employee-position">Должность</label>
                    <input type="text" id="employee-position" name="position" placeholder="например: прораб, разнорабочий">
                </div>
                <div class="form-group">
                    <label for="employee-phone-numbers">Телефоны (через запятую)</label>
                    <input type="text" id="employee-phone-numbers" name="phone_numbers" placeholder="+7 999 123-45-67, +7 999 765-43-21">
                </div>
                <div class="form-group">
                    <label for="employee-employment-type">Тип занятости</label>
                    <select id="employee-employment-type" name="employment_type">
                        <option value="постоянно">Постоянно</option>
                        <option value="разово">Разово</option>
                        <option value="удалённо">Удалённо</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="employee-hire-date">Дата трудоустройства</label>
                    <input type="date" id="employee-hire-date" name="hire_date">
                </div>
                <div class="form-group">
                    <label for="employee-dismissal-date">Дата увольнения</label>
                    <input type="date" id="employee-dismissal-date" name="dismissal_date">
                </div>
                <div class="form-group">
                    <label for="employee-status">Статус</label>
                    <select id="employee-status" name="status">
                        <option value="Работает">Работает</option>
                        <option value="Уволен">Уволен</option>
                        <option value="Кандидат">Кандидат</option>
                        <option value="Запас">Запас</option>
                        <option value="Консультант">Консультант</option>
                        <option value="Подрядчик">Подрядчик</option>
                        <option value="Временный">Временный</option>
                        <option value="Не указан">Не указан</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="employee-address-actual">Адрес фактический</label>
                    <textarea id="employee-address-actual" name="address_actual" rows="2"></textarea>
                </div>
                <div class="form-group">
                    <label for="employee-address-registration">Адрес по прописке</label>
                    <textarea id="employee-address-registration" name="address_registration" rows="2"></textarea>
                </div>
                <div class="form-group">
                    <label for="employee-comment">Комментарий</label>
                    <textarea id="employee-comment" name="comment" rows="3"></textarea>
                </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" onclick="closeAddEmployeeModal()">Отмена</button>
                <button type="submit" form="add-employee-form" class="btn btn-primary">Сохранить</button>
            </div>
        </div>
    </div>

    <script src="assets/js/api.js"></script>
    <script src="assets/js/navigation.js"></script>
    <script src="assets/js/employees.js"></script>
</body>
</html>

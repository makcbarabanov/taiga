<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Taiga - Расходы</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="assets/css/styles.css">
    <link rel="stylesheet" href="assets/css/expenses.css">
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header class="header">
            <h1>
                <img src="assets/images/logo_taiga.png" alt="Taiga" style="height: 40px; vertical-align: middle;">
                <span style="position: absolute; left: 50%; transform: translateX(-50%);">Управление компанией</span>
                <div style="display: flex; gap: 15px; align-items: center;">
                    <a href="rules.html" title="Правила обучения распознавания расходов" style="font-size: 24px; text-decoration: none; color: var(--secondary-color); transition: all 0.2s;" onmouseover="this.style.transform='scale(1.2)'; this.style.color='#2980b9';" onmouseout="this.style.transform='scale(1)'; this.style.color='var(--secondary-color)';">
                        📚
                    </a>
                    <a href="catalogs.html" title="Справочники работ и материалов" style="font-size: 24px; text-decoration: none; color: var(--secondary-color); transition: all 0.2s;" onmouseover="this.style.transform='scale(1.2)'; this.style.color='#2980b9';" onmouseout="this.style.transform='scale(1)'; this.style.color='var(--secondary-color)';">
                        📋
                    </a>
                    <a href="catalogs.html" title="Справочник работ" style="font-size: 24px; text-decoration: none; color: var(--secondary-color); transition: all 0.2s;" onmouseover="this.style.transform='scale(1.2)'; this.style.color='#2980b9';" onmouseout="this.style.transform='scale(1)'; this.style.color='var(--secondary-color)';">
                        🔨
                    </a>
                </div>
            </h1>
            <nav class="nav">
                <div class="nav-left">
                    <a href="expenses.html" class="nav-link active" id="expenses-nav-link">Расходы</a>
                    <a href="income.html" class="nav-link">Доходы</a>
                <a href="taiga.html" class="nav-link">Объекты</a>
                <a href="cash.html" class="nav-link" id="cash-nav-link">Касса</a>
                </div>
                <div class="nav-right">
                    <a href="shops.html" class="nav-link directory-link">Маги</a>
                    <a href="employees.html" class="nav-link directory-link">Сотрудники</a>
                </div>
            </nav>
        </header>

        <!-- Main Content -->
        <main class="main">
            <!-- Actions -->
            <div class="actions">
                <button class="btn btn-primary" onclick="addNewRow()">+ Добавить строку</button>
                <button class="btn btn-success" onclick="saveAllChanges()">💾 Сохранить изменения</button>
                <button class="btn btn-secondary" onclick="clearFilters()">Очистить фильтры</button>
            </div>

            <!-- Filters -->
            <div class="filters">
                <select id="filter-category" onchange="filterExpenses()">
                    <option value="">Категории</option>
                </select>
                <select id="filter-subcategory" onchange="filterExpenses()">
                    <option value="">Наименование</option>
                </select>
                <input type="number" id="filter-price-min" placeholder="Цена от" step="0.01" oninput="filterExpenses()" class="filter-price">
                <input type="number" id="filter-price-max" placeholder="Цена до" step="0.01" oninput="filterExpenses()" class="filter-price">
                <input type="number" id="filter-amount-min" placeholder="Стоимость от" step="0.01" oninput="filterExpenses()" class="filter-amount">
                <input type="number" id="filter-amount-max" placeholder="Стоимость до" step="0.01" oninput="filterExpenses()" class="filter-amount">
                <select id="filter-client" onchange="filterExpenses()">
                    <option value="">Клиенты</option>
                </select>
                <select id="filter-project" onchange="filterExpenses()">
                    <option value="">Объекты</option>
                </select>
                <select id="filter-shop" onchange="filterExpenses()">
                    <option value="">Магазины</option>
                </select>
                <input type="month" id="filter-month" onchange="filterExpenses()">
            </div>

            <!-- Expenses Table -->
            <div class="table-container editable-table-container">
                <table class="table editable-table" id="expenses-table">
                    <thead>
                        <tr>
                            <th class="col-id">N</th>
                            <th class="col-date">Дата</th>
                            <th class="col-category">Категория</th>
                            <th class="col-subcategory">Наименование</th>
                            <th class="col-unit">Ед. изм.</th>
                            <th class="col-quantity">Кол-во</th>
                            <th class="col-price">Цена</th>
                            <th class="col-amount">Стоимость</th>
                            <th class="col-client">Клиент</th>
                            <th class="col-project">Объект</th>
                            <th class="col-shop">Магазин</th>
                            <th class="col-comment">Комментарий</th>
                            <th class="col-actions"></th>
                        </tr>
                    </thead>
                    <tbody id="expenses-tbody">
                        <!-- Данные будут загружены через JS -->
                    </tbody>
                </table>
            </div>

            <!-- Summary -->
            <div class="summary">
                <div class="summary-item">
                    <span class="summary-label">Всего расходов:</span>
                    <span class="summary-value" id="total-expenses">0.00 ₽</span>
                </div>
            </div>
        </main>
    </div>

    <!-- Modal: Upload PDF/XLS -->
    <div id="upload-modal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeUploadModal()">&times;</span>
            <h2>Загрузить чек (PDF/XLS)</h2>
            <form id="upload-form">
                <div class="form-group">
                    <label for="upload-file">Выберите файл</label>
                    <input type="file" id="upload-file" name="file" accept=".pdf,.xls,.xlsx" required>
                </div>
                <div class="form-actions">
                    <button type="submit" class="btn btn-primary">Загрузить</button>
                    <button type="button" class="btn btn-secondary" onclick="closeUploadModal()">Отмена</button>
                </div>
            </form>
        </div>
    </div>

    <script src="assets/js/api.js"></script>
    <script src="assets/js/navigation.js"></script>
    <script src="assets/js/expenses.js"></script>
</body>
</html>
